<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360">
<rect width="1180" height="360" fill="#f5f8fc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#18304d} .h{font-size:25px;font-weight:bold}.t{font-size:21px}.n{font-size:17px}</style>
<text x="30" y="42" class="h">USE通用星基预训练：不要求滑坡内容，也不要求覆盖已有滑坡区</text>
<rect x="25" y="68" width="1130" height="67" rx="9" fill="#dcefe5"/>
<text x="43" y="95" class="t">本地已准入：11132份训练观测（S2 9510 / Landsat 1622）</text>
<text x="43" y="122" class="n">当前未形成验收完成的四视图组；未配对观测仍可分别用于恢复预训练</text>
<rect x="25" y="148" width="1130" height="67" rx="9" fill="#dfeafa"/>
<text x="43" y="175" class="t">公开规模来源：S12 v1.1 246144位置×4时相；组合库66800候选位置</text>
<text x="43" y="202" class="n">S1/S2/Landsat关系需按实际产品、位置、日期和物理量准入；两来源不能直接相加</text>
<rect x="25" y="228" width="1130" height="67" rx="9" fill="#f4ead7"/>
<text x="43" y="255" class="t">跨分辨率补充：SEN2VENµS 132955图块 / 29地区；WorldStrat 3449区域实例</text>
<text x="43" y="282" class="n">均为真实卫星来源；保留原生分辨率、配对与处理版本，图块数不等于独立地区数</text>
<text x="30" y="333" class="n">单位不同且来源可重叠，禁止求和；公开数量不等于已下载或可直接训练的数量。</text></svg>