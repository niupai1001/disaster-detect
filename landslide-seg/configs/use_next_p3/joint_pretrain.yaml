segformer:
  experiment: segformer_b0_direct10_detailres_n100_u3600_s1234
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: s2_10band_v4r1_p20
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_core25.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol.json
  model:
    type: use_next_p3
    in_chans: 10
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 0.0003
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: cosine
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 8
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 10000
    budget_mode: updates
    eval_every_updates: 500
    schedule_updates: 10000
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
use_next_p3:
  stage: P3
  mode: physical
  task: pretrain
  steps: 10000
  seed: 1234
  head_seed: 1235
  width: 192
  layers: 2
  heads: 6
  physical_patch_m: 120
  subcell_m: 30
  pixel_block: 4
  microbatch: 2
  effective_batch: 8
  data_release: outputs/use_next_v2/data/data_release_v1
  data_manifest_sha256: b7678880278a26fd56e3f79a7cc63a2a188c4498edb040dff149a157700d5ff1
  calibration: outputs/use_next_v2/p2_engineering/calibration.json
  u0: outputs/use_next_v2/p3_engineering/u0.pt
  schedule: outputs/use_next_v2/data/schedule_seed1234.jsonl
  selection: fixed_u10000
  frozen_source: outputs/use_next_v2/runs/p3_joint/last.pt
  precision: FP32
  tf32: false
  loss:
    scale: same TRAIN-calibrated120m low-frequency MSE
    latent: per-feature LayerNorm MSE of detached EMA120m patch target
    joint: scale+latent, fixed unit weights; absent scale on SAR does not rescale
      latent
  sar_target: NOT_AVAILABLE_NO_VERIFIED_NOISE_CALIBRATION
  schedule_type: cosine
  warmup_updates: 500
  milestones:
  - 1000
  - 3000
  - 5000
  - 7500
  - 10000
  objective: joint
  source_objective: joint
  ema:
    start: 0.996
    end: 1.0
    schedule: cosine
    boundary: new local encoder only; anchors excluded
  band_drop:
    probability: 0.5
    minimum_fraction: 0.2
    maximum_fraction: 0.4
    integer_policy: clamp_round_to_ceil_floor
