# 官方单期 · U-Net 组 · 十波段基线
#
# 与同名 SegFormer 组同数据/同统计/同划分/同损失/同预算/同 seed，只换架构族。
# 注意：ResNet18-UNet（14.35M）与 SegFormer-B0+细节分支（3.75M）不是同参数量对照，
# 差异不可单独归因于编码器或"架构优劣"。学习率沿用 SegFormer 那一套（encoder 6e-5 / 其余 6e-4），
# 未为 U-Net 单独调参——因此四组之间的对比是本组内可比，跨架构的绝对数值需谨慎。
segformer:
  experiment: UNet-ResNet18-OfficialSingle-Baseline
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: official_unet
    source_root: data/sen12
    cache_dir: data/s2_official_single
    manifest: manifests/official_single/trainval.jsonl
    quarantine: manifests/official_single/exclusions.jsonl
    stats: manifests/official_single/stats_train.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/official_single/protocol.json
  model:
    type: unet
    in_chans: 10
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    extra_channel: none
    unet:
      encoder_name: resnet18
      encoder_weights: imagenet
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: 1.0
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_pooled_iou
