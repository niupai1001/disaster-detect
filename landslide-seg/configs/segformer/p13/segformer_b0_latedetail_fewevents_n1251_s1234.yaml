# P1-3 事件覆盖对照 · FewEvents（3 个事件：dominicamaria + indonesia + kyrgyzstan1）
#
# 与 v4r1 LateDetail 同架构（B0 + direct10 + 原网格 32ch Stem + 末端残差融合），
# 只改训练集的事件覆盖。两组同一 N，同一份「共同核心」归一化统计，同一预算。
# 选择规则见 manifests/p13/selection_rule.json（训练前已冻结）。
segformer:
  experiment: segformer_b0_latedetail_fewevents_n1251_s1234
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: p13_events
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/p13/few/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/p13/stats_common_core.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/p13/few/protocol.json
  model:
    type: segformer
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    exchange: none
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
