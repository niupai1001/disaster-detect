# 作废：四折地形统计同样存在坡度 100 倍单位错配；该线已取消，配置未成功运行。
# 四折事件协议 · F2 · DEM＋坡度直入（12 通道原始信息）
#
# 起点：SegFormer B0 十波段直入 + 原网格细节残差（event_cv_v5 控制组）。
# 本组只改：在十波段末尾追加 1 个 DEM 与 1 个坡度通道（本折 TRAIN 统计）。
# 预算：3600 次成功更新、有效 batch 64、FP32、0.5 BCE + 0.5 Dice、原 lr 与 poly。
# 选模：内部验证（newzealand）事件平均 IoU@0.5，外部 china 不参与选择。
segformer:
  experiment: SegFormer-LateDetail-EventCVV5-F2-DEMSlopeRaw
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: event_cv_v5_dem
    source_root: data/sen12
    cache_dir: data/s2_official_single_geo
    manifest: manifests/event_cv_v5/F2/pool_100.jsonl
    quarantine: manifests/official_single/exclusions.jsonl
    stats: manifests/event_cv_v5/F2/stats_geoboth.json
    test_event: china
    val_event: newzealand
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/event_cv_v5/F2/protocol_geoboth.json
  model:
    type: segformer
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    exchange: none
    in_chans: 12
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    - DEM
    - SLOPE
    extra_channel: both
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: 1.0
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
