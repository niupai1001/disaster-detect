segformer:
  experiment: use_recovery_base
  seed: 1234
  deterministic: true
  output_dir: outputs/use_recovery_probe
  data:
    version: s2_10band_v4r1_p20
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_core25.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol.json
    mixed_bands: true
  model:
    type: use
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    fusion: sum
    fusion_width: 64
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
    unet:
      encoder_name: resnet18
      encoder_weights: imagenet
    use: {}
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    coarse_weight: 0.0
    boundary_weight: 0.0
    boundary_width: 2
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    first_conv_lr: null
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  sampling:
    mode: natural
    event_power: 0.5
    scale_power: 0.5
    max_weight: 4.0
  train:
    epochs: 150
    batch_size: 8
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 2000
    budget_mode: updates
    eval_every_updates: 100
    stop_updates: 2000
    schedule_updates: 3600
    report_steps:
    - 500
    - 1000
    - 1500
    - 2000
    freeze_bn_running_stats: true
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
  recovery:
    teacher: outputs/use/s2_10band_v4r1_p20/use_baseline/1234/best.pt
    teacher_sha256: 5498d1dec476613c77f4bed2aea3e4ba6d589cd3c4fb67852043568954e83e98
    calibration:
      members: 512
      selection_seed: 20261024
      updates: 200
      batch_size: 8
      lr: 0.0006
      weight_decay: 0.01
      warmup_updates: 10
      feature_stage: mit.stage1
      sampling: full10
    feature:
      coefficient: 0.05
      stages:
      - mit.stage1
      - mit.stage2
      normalization: train_teacher_running
    short:
      updates: 300
      batch_size: 8
      eval_every: 50
      fit_manifest: outputs/use_interface_diagnostics/selection/diagnostic_tiles.json
    formal:
      stop_updates: 2000
      schedule_updates: 3600
      warmup_updates: 180
      eval_every: 100
      report_steps:
      - 500
      - 1000
      - 1500
      - 2000
