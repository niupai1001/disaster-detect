# 修订版：协议 event_ood_v4r1（TRAIN=2223 / DEV=Hiroshima448+Thrissur221 / seed1234）
# 修订内容：坡度通道按侧表原始单位（0.01°）做归一化统计，修正旧版 100 倍尺度错误。
# 起点：SegFormer B0 十波段直入 + 原网格细节残差（v4r1 基线，DEV 事件平均 IoU 选模）
# 本组只改：同起点继续自监督 3000 步（与 sslsup 等预算），再接入可学习 α 评分。
# 统计：十波段沿用 stats_core25.json（559 块核心，未重拟合）；DEM/坡度由本 TRAIN 2223 块拟合
# 侧表：data/v4r1_geo（原 npz 与清单不动，DEM/坡度按 sample_id 读取）
segformer:
  experiment: SegFormer-B0-LateDetail-OODv4-TerrainSSLBudget
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: s2_10band_v4r1_geo_raw
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_geoboth_raw.json
    extra_sidecar: data/v4r1_geo
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol_geoboth_raw.json
  model:
    type: terrain_fusion
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    in_chans: 12
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    - DEM
    - SLOPE
    extra_channel: both
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
    terrain:
      start: ssl
      alpha: 0.01
      alpha_learnable: true
      weights: weights/terrain/v4r1raw_ssl_extra.pt
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
