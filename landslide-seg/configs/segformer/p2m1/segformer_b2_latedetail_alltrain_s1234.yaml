# P2-M1 同族规格对照 · B2 主干（decoder 768，27.43M）
#
# 与 v4r1 LateDetail 完全同数据（2223 TRAIN / 669 DEV）、同 stats、同损失、同增强、
# 同预算（batch64 / 3600 更新）、同 seed；只改主干规格。
# 结论只能称"同族规格对照"，差异不可单独归因于 encoder 容量：
# B2 的 decoder 也是 768 维（B0 为 256），参数量 27.43M vs 3.75M。
segformer:
  experiment: segformer_b2_latedetail_alltrain_s1234
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: p2m1
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_core25.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol.json
  model:
    type: segformer
    backbone: b2
    adapter: direct10
    stem: true
    refine: none
    exchange: none
    pretrained_dir: weights/segformer/segformer-b2-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b2-finetuned-ade-512-512（目录名/元信息写法；文件内容为 B2-768，见 reports/p2m1/b2_interface_validation.md）
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
