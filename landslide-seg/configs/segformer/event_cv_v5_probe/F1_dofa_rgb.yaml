# EVENT_CV_V5 · F1 · 冻结表征 probe · DOFA 预训练编码器 + RGB
#
# 编码器整体冻结（eval、无梯度），只训四个 1×1 头；无可训练仿射参数的通道 LayerNorm；
# 四层 logits 插值到 128×128 后等权平均。初始头为零初始化，首步输出恒为 0。
# 学习率只作用于头（encoder 组为空），沿用原 warmup/poly 与增强。
segformer:
  experiment: Probe-dofa_rgb-F1
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: event_cv_v5_probe
    source_root: data/sen12
    cache_dir: data/s2_official_single_geo
    manifest: manifests/event_cv_v5/F1/pool_100.jsonl
    quarantine: manifests/official_single/exclusions.jsonl
    stats: manifests/event_cv_v5/F1/stats_train.json
    test_event: italy
    val_event: newzealand
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/event_cv_v5/F1/protocol.json
  model:
    type: probe
    in_chans: 10
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    extra_channel: none
    probe:
      encoder: dofa_rgb
      pretrained_dir: weights/dofa
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: 1.0
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
