# BENCH_OFFICIAL / S12LS-LD / harmonized s2 / 单期变体 · 输入同基线，仅 pos_weight 1→5
#
# 对照组基线：SegFormer-LateDetail-OfficialSplit-SingleDate（十波段、pos_weight=1）
#   官方 VAL pooled IoU 0.3623 / TEST 0.3275
# 本组只改一处：损失里的 pos_weight 1→5（输入、数据、统计、协议全部与基线相同）
segformer:
  experiment: SegFormer-LateDetail-OfficialSingle-PW5
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: official_single
    source_root: data/sen12
    cache_dir: data/s2_official_single
    manifest: manifests/official_single/trainval.jsonl
    quarantine: manifests/official_single/exclusions.jsonl
    stats: manifests/official_single/stats_train.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/official_single/protocol.json
  model:
    type: segformer
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    exchange: none
    in_chans: 10
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    extra_channel: none
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: 5.0
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_pooled_iou
