# BENCH_OFFICIAL / S12LS-LD / harmonized s2 / 单期变体
#
# 官方 split（commit 2eb025bd…）下的单期十波段 SegFormer-B0 + 原网格末端细节路径。
# 只换数据入口与 split；模型、损失、优化、预算与事件 OOD 主线保持一致。
# 注意：官方是多时相 + DEM，本组是单期变体，不声称复现官方多时相基线。
segformer:
  experiment: SegFormer-LateDetail-OfficialSplit-SingleDate
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: official_single
    source_root: data/sen12
    cache_dir: data/s2_official_single
    manifest: manifests/official_single/trainval.jsonl
    quarantine: manifests/official_single/exclusions.jsonl
    stats: manifests/official_single/stats_train.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/official_single/protocol.json
  model:
    type: segformer
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    exchange: none
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 3600
    budget_mode: updates
    eval_every_updates: 100
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_pooled_iou   # 官方 VAL 前景 pooled IoU@0.5
