# S3-B：4×4 小块内十波段 token 自注意力，只有自由可学习 band ID，无波长条件、无关系偏置。
# 自由 ID 经同尺寸 width×width 线性层，与波长嵌入层可训练参数一致。
# 位置：十波段入口前残差修正，修正后同时进入主路与细节分支。
segformer:
  experiment: SegFormer-B0-S3B-IDAttention
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: v4r2_spectral
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_core25.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol.json
  model:
    type: spectral_relation
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    in_chans: 10
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    extra_channel: none
    spectral_relation:
      patch: 4
      width: 64
      heads: 4
      layers: 2
      relation_mode: none
      identity: channel
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 2000
    stop_updates: 2000
    schedule_updates: 3600
    budget_mode: updates
    eval_every_updates: 100
    report_steps:
    - 1000
    - 1500
    - 2000
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
