# S2 真波长条件映射（对照为同参数量的自由通道混合）。
# 协议 event_ood_v4r1（TRAIN=2223 / DEV=Hiroshima448+Thrissur221 / seed1234），单期十波段。
# 起点：SegFormer B0 十波段直入 + 原网格细节残差（v4r1 基线）。
# 本组只改入口：10×10 线性混合 + 偏置；treatment 的混合矩阵由各波段中心波长生成，
# 对照用同参数量的自由 10×10 矩阵。两者都从恒等残差起步（权重零初始化）。
# 预算：停止 2000 次成功更新，学习率日程沿用旧 3600 步（预热 180）。
segformer:
  experiment: SegFormer-B0-LateDetail-OODv4-S2Mapping-PLACEHOLDER
  seed: 1234
  deterministic: true
  output_dir: outputs/segformer
  data:
    version: s2_10band_v4r2_spectral_mapping
    source_root: data/sen12
    cache_dir: data/s2_10band_v4_p20
    manifest: manifests/v4r1/pool_100.jsonl
    quarantine: manifests/s2_10band_v4_p20_quarantine.jsonl
    stats: manifests/v4r1/stats_core25.json
    test_event: italy
    val_event: hiroshima
    max_cloud: 0.5
    min_valid_ratio: 0.5
    max_label_invalid_ratio: 0.6
    warn_days_after_event: 365
    post_event_window_days: 120
    image_size: 128
    num_workers: 0
    preload: true
    pool_fraction: 100
    protocol: manifests/v4r1/protocol.json
  model:
    type: spectral_ladder
    backbone: b0
    adapter: direct10
    stem: true
    refine: none
    in_chans: 10
    band_order:
    - B02
    - B03
    - B04
    - B05
    - B06
    - B07
    - B08
    - B8A
    - B11
    - B12
    extra_channel: none
    spectral_ladder:
      level: S2
      variant: conditional
      rank: 4
    pretrained_dir: weights/segformer/segformer-b0-finetuned-ade-512-512
    pretrained_source: nvidia/segformer-b0-finetuned-ade-512-512
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optim:
    encoder_lr: 6.0e-05
    head_lr: 0.0006
    weight_decay: 0.01
    grad_clip: 1.0
    warmup_frac: 0.05
    schedule: poly
    poly_power: 1.0
  train:
    epochs: 150
    batch_size: 64
    amp: false
    amp_dtype: bf16
    log_every: 20
    max_steps: 2000
    stop_updates: 2000
    schedule_updates: 3600
    budget_mode: updates
    eval_every_updates: 100
    report_steps:
    - 1000
    - 1500
    - 2000
  eval:
    threshold: 0.5
    scale_thresholds_ha:
    - 0.5
    - 2.0
    object_iou_threshold: 0.25
    object_iou_strict: 0.5
    boundary_tol_px: 1
    selection_metric: dev_event_mean_iou
